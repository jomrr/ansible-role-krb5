---
# role: krb5
# file: tasks/main.yml

- name: KRB5 | Load platform settings
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', __krb5_platform_files) }}"
  vars:
    __krb5_platform_files:
      files:
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: KRB5 | Install the Kerberos client
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ __krb5_package }}"
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: KRB5 | Create the configuration include directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/krb5.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: KRB5 | Configure system Kerberos
  become: true
  become_user: root
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
